name: Assign PR Reviewer

on:
  pull_request:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Find issue and assign reviewer
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;

            console.log("Processing PR #" + pullNumber);
            console.log("PR author: @" + prAuthor);

            // ==========================================
            // GET PULL REQUEST
            // ==========================================

            const prResponse = await github.rest.pulls.get({
              owner: owner,
              repo: repo,
              pull_number: pullNumber
            });

            const pr = prResponse.data;

            // ==========================================
            // FIND LINKED ISSUE
            // ==========================================

            const text =
              (pr.title || "") +
              "\n" +
              (pr.body || "");

            // NOTE: "fix" must be followed by an OPTIONAL "e[sd]" group.
            // Previously this was fix(?:e[sd]?) which made the "e" mandatory,
            // so plain "Fix #12" (without an "e") never matched.
            const regex =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;

            const issueNumbers = [];

            let match;

            while ((match = regex.exec(text)) !== null) {
              issueNumbers.push(Number(match[1]));
            }

            if (issueNumbers.length === 0) {
              console.log("No linked issue found.");
              return;
            }

            console.log(
              "Linked issues: " + issueNumbers.join(", ")
            );

            // ==========================================
            // GET REPOSITORY COLLABORATORS
            // ==========================================

            const collaborators =
              await github.paginate(
                github.rest.repos.listCollaborators,
                {
                  owner: owner,
                  repo: repo,
                  per_page: 100
                }
              );

            const validCollaborators =
              collaborators.filter(function (user) {
                return user.type === "User";
              });

            if (validCollaborators.length === 0) {
              core.setFailed(
                "No repository collaborators found."
              );
              return;
            }

            console.log(
              "Found " +
              validCollaborators.length +
              " repository collaborators."
            );

            // ==========================================
            // PROCESS FIRST LINKED ISSUE
            // ==========================================

            const issueNumber = issueNumbers[0];

            const issueResponse =
              await github.rest.issues.get({
                owner: owner,
                repo: repo,
                issue_number: issueNumber
              });

            const issue = issueResponse.data;

            const issueCreator =
              issue.user.login;

            console.log(
              "Issue #" +
              issueNumber +
              " created by @" +
              issueCreator
            );

            // ==========================================
            // CHECK ISSUE CREATOR
            // ==========================================

            const creatorIsCollaborator =
              validCollaborators.some(function (collaborator) {
                return (
                  collaborator.login.toLowerCase() ===
                  issueCreator.toLowerCase()
                );
              });

            console.log(
              "Issue creator is collaborator: " +
              creatorIsCollaborator
            );

            // ==========================================
            // SELECT REVIEWER
            // ==========================================

            let reviewer = null;

            if (
              creatorIsCollaborator &&
              issueCreator.toLowerCase() !==
                prAuthor.toLowerCase()
            ) {
              reviewer = issueCreator;

              console.log(
                "Assigning issue creator @" +
                reviewer +
                " as reviewer."
              );
            } else {
              const availableReviewers =
                validCollaborators.filter(
                  function (collaborator) {
                    return (
                      collaborator.login.toLowerCase() !==
                      prAuthor.toLowerCase()
                    );
                  }
                );

              if (availableReviewers.length === 0) {
                console.log(
                  "No available collaborator can review this PR."
                );
                return;
              }

              const randomIndex =
                Math.floor(
                  Math.random() *
                  availableReviewers.length
                );

              reviewer =
                availableReviewers[randomIndex].login;

              console.log(
                "Random collaborator selected: @" +
                reviewer
              );
            }

            // ==========================================
            // FINAL SAFETY CHECK
            // ==========================================

            if (
              reviewer.toLowerCase() ===
              prAuthor.toLowerCase()
            ) {
              console.log(
                "Reviewer cannot be the PR author."
              );
              return;
            }

            // ==========================================
            // CHECK EXISTING REVIEWER REQUESTS
            // ==========================================

            const reviewerResponse =
              await github.rest.pulls.listRequestedReviewers({
                owner: owner,
                repo: repo,
                pull_number: pullNumber
              });

            const requestedUsers =
              reviewerResponse.data.users || [];

            const alreadyRequested =
              requestedUsers.some(function (user) {
                return (
                  user.login.toLowerCase() ===
                  reviewer.toLowerCase()
                );
              });

            if (alreadyRequested) {
              console.log(
                "@" +
                reviewer +
                " is already requested."
              );
              return;
            }

            // ==========================================
            // REQUEST REVIEW
            // ==========================================

            await github.rest.pulls.requestReviewers({
              owner: owner,
              repo: repo,
              pull_number: pullNumber,
              reviewers: [reviewer]
            });

            console.log(
              "Review requested from @" +
              reviewer
            );

            // ==========================================
            // CREATE PR COMMENT
            // ==========================================

            let reason;

            if (creatorIsCollaborator) {
              reason =
                "The issue creator is a repository collaborator, so they have been assigned as the reviewer.";
            } else {
              reason =
                "The issue creator is not a repository collaborator, so a repository collaborator was randomly selected as the reviewer.";
            }

            const comment =
              "👀 **Reviewer Assigned**\n\n" +
              "Reviewer: @" +
              reviewer +
              "\n\n" +
              reason +
              "\n\n" +
              "Linked issue: #" +
              issueNumber;

            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: pullNumber,
              body: comment
            });

            console.log(
              "Comment added to PR #" +
              pullNumber
            );

            console.log(
              "Reviewer assignment completed successfully."
            );

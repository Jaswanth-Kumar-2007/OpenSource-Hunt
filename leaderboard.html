<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenSource-Hunt | PR Leaderboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div>
        <h1>OpenSource-Hunt</h1>
        <p>Pull Requests, Commits & Leaderboard</p>
    </div>

    <a
        href="https://github.com/Jaswanth-Kumar-2007/OpenSource-Hunt"
        target="_blank"
        class="repo-btn"
    >
        View Repository
    </a>

</header>


<main class="container">

    <!-- Leaderboard -->

    <section class="leaderboard-section">

        <div class="section-title">
            <h2>🏆 Contributor Leaderboard</h2>

            <p>
                Ranked by PRs first, then commits
            </p>
        </div>

        <div id="leaderboard" class="leaderboard">

            <div class="loading">
                Loading leaderboard...
            </div>

        </div>

    </section>


    <!-- Pull Requests -->

    <section class="prs-section">

        <div class="top-section">

            <div>
                <h2>Pull Requests</h2>
                <p id="pr-count">Loading...</p>
            </div>

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="open"
                >
                    Open
                </button>

                <button
                    class="filter-btn"
                    data-filter="closed"
                >
                    Closed
                </button>

            </div>

        </div>


        <div id="loading" class="loading">
            Loading pull requests...
        </div>

        <div id="error" class="error hidden"></div>

        <section id="pr-container"></section>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
